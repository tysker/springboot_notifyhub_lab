spring.application.name=notifyhub-app
notifyhub.email.sender=noreply@notifyhub.io
notifyhub.channels.default-channel=email
notifyhub.channels.enabled=email,sms,slack
#notifyhub.sms.enabled=false
notifyhub.stats.cron=*/10 * * * * *
# Opensearch
notifyhub.opensearch.base-url=http://localhost:9200
notifyhub.opensearch.alias=notifications
notifyhub.opensearch.fail-on-startup=false
# Logging
#logging.level.io.github.tysker.notifyhub=DEBUG
# Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/notifyhub
spring.datasource.username=notifyhub
spring.datasource.password=notifyhub
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false